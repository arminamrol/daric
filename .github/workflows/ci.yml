name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # API tests create and migrate a throwaway `daric_test` database here.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daric
          POSTGRES_PASSWORD: daric
          POSTGRES_DB: daric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daric -d daric"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://daric:daric@localhost:5432/daric
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
