name: CLA

# Every pull request author must sign CLA.md (ADR-0007). Signatures are kept in
# signatures/cla.json on the `cla-signatures` branch, outside `main`'s branch protection.
# Runs on pull_request_target so it can comment on pull requests from forks; it never
# checks out or runs code from the pull request.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/arminamrol/daric/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer owns the code and needs no licence from themselves; bots author no work.
          allowlist: arminamrol,dependabot[bot],renovate[bot],github-actions[bot]
